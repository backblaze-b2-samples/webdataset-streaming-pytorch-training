packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@babel/core": 7.29.6
  "@hono/node-server": 1.19.15
  body-parser: 2.3.0
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  browserslist: 4.28.7
  esbuild: 0.25.0
  hono: 4.12.34
  lodash: 4.18.1
  "minimatch@<3.1.4": 3.1.4
  "minimatch@>=9.0.0 <9.0.7": 9.0.7
  "picomatch@>=4.0.0 <4.0.4": 4.0.7
  "postcss-selector-parser@>=7.1.0 <7.1.3": 7.1.3
  vite: 6.4.3
# Dependencies whose install/build scripts are trusted to run during
# `pnpm install` (including fresh per-worktree `pnpm run setup`); pnpm blocks
# all others by default. esbuild's postinstall links its platform binary.
allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
